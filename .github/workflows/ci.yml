name: ci configuration
on: 
  push:
    branches:
      - main
  pull_request:
jobs:
  run-tests: 
    runs-on: ubuntu-latest
    steps: 
      - name: clone
        uses: actions/checkout@v4
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: install-packages
        run: npm ci
      - name: run-tests
        run: npm test
      